<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hei verden</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    .kort {
      background: white;
      padding: 40px 60px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      text-align: center;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 3rem;
      color: #1e3c72;
    }

    p {
      margin: 0;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="kort">
    <h1>Hei verden! 👋</h1>
    <p>Min første nettside med HTML og CSS.</p>
  </div>
</body>
</html>
